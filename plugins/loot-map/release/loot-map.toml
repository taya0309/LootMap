# ===========================================================================
#  Loot Map —— 掉落物地图标记插件  配置文件        （v0.18.9）
#  路径：<游戏目录>\d2rloader\config\loot-map.toml
#  （模组内则是 <游戏目录>\mods\<模组名>\d2rloader\config\loot-map.toml）
#
#  说明：面板上一动任何控件，插件就会把这个文件按当前设置重写一遍
#        （所以手改的值会被面板覆盖 —— 颜色/大小/位置/保留秒数都能在面板上直接调）。
#        手改想立刻生效：进游戏按 ` 开控制台，输入  lootmap-reload
# ===========================================================================

#  ⚠ 运行前提：星形标记与新版面板（F7）都画在「RuffnecKk MapSense」地图插件的
#     叠加层里 —— 必须装了 MapSense（d2rloader\plugins\d2rl-ruffneckk-mapsense.dll）
#     才有星、F7 才是新版面板；没装的话只有物品颜色生效，F7 弹出的是插件自带的
#     老式原生面板（一堆小方框 + 色块）。
# ===========================================================================

[loot-map]

# 总开关。false = 插件完全不动游戏（连钩子都不装）
enabled = true

# 工作模式：
#   "color"   —— 按下面的设置，把物品真正画到地图上（当前默认，已验证）
#   "observe" —— 只观察、只写日志，**不改变任何游戏显示**（排查用）
mode = "color"


# ── 星标外观 ────────────────────────────────────────────────
#  ★ v0.17.0：面板重做后只显示「总开关 / 品质(暗金·套装) / 规则(珠宝匠·工匠) /
#  星星(样式·大小·描边)」。下面这些键面板上不再出现，但**全部有效**，改配置即可。
#  stars = 总开关（面板最上面那个勾），false = 地图上什么都不画。
#  star_size = 星的半径（像素），面板滑条范围 12~36，配置超范围会被钳进区间。
stars = true
star_size = 16

# 星标位置微调（像素）。★ v0.17.0 起面板不再显示，只改配置。
star_offset_x = 0
star_offset_y = 0

# 星标样式：1 = 暗黑3 风（默认）—— 分层渐变（边缘深、中心亮）+ 圆润星臂 + 深色描边，
#            就是暗黑3地图上那种金色立体星的样子；渐变基于你在面板上选的颜色。
#            0 = 简约（单色平板）。
star_style = 1

# 星标描边粗细 = 半径的百分之几（0 = 不描边）。默认 5（暗黑3 风的星配细一点更像）。
#  星是一次画成的整块（不再有一条条"分界线"），外圈按亮度自动配黑边或白边：
#  亮色填充配黑边、暗色填充配白边，缩到多小都按比例跟着缩。
star_outline = 5

# 坐标换算：1 = 按引擎自己的公式（默认，已实测定案）；0 / 2 仅对照用。
star_coord_mode = 1
star_coord_debug = false


# ── 星标"驻留"（多看一会儿）─────────────────────────────────
#  ⚠ 默认 0 = 只显示"引擎当帧报的那几件"，**位置永远准**。
#  为什么默认 0：引擎给的坐标只在它当帧的语境里才对。一旦引擎不再报你
#  （物品出了雷达/地图范围、或你开了背包菜单），我们手里那对数字就不再跟着
#  世界走 —— 这时候还"留着"它，星就会停在屏幕原位、看起来跟着人物移动。
#  调大（0~8 秒）= 星多显示一会儿，但那一刻位置会飘。
star_persist_sec = 0


# ── 行为开关 ────────────────────────────────────────────────
# 面板挡鼠标：面板打开且光标在面板上时，吞掉落在面板里的点击，游戏收不到
#（点面板时人物不动）。用 WH_MOUSE 钩子实现，不动游戏代码，关面板即还原。
block_game_mouse = true

# 面板底下的星变淡（默认 false = 不变淡）。
#  关着 = 星的亮度只跟品质有关，不会因为"开了背包/菜单"忽明忽暗。
dim_star_under_panel = false

# 引擎色号兜底：**默认 false（关）**。这是条老兜底：品质读不出来时，靠"引擎给的色号"
# 去猜它是不是套装/暗金。实测它会大面积误判 —— 它会把色号 0 学成"暗金色号"，
# 而 0 是引擎对绝大多数**普通物品**的返回值，结果满地的药水/卷轴/魔法装备全被画成
# 暗金星（就是"只爆一件，地图上却一片星星"）。现在物品的引擎标记已经一律压掉，
# 不需要它了；确实想试的人可以改成 true。
engine_colour_rescue = false

# 地图显示范围（雷达）：1 = 不动游戏。本机实测标定经常失败、不稳定，建议保持 1。
map_zoom_div = 1

# 自带字体图集总开关（★ v0.17.7）：true = 面板用插件自带的微软雅黑（字体统一）。
# 如果面板出现花字/颜色异常，改成 false 立刻回到游戏合并字体（可读、混排），无需重装。
own_font = true


# ── 显示哪几类 ──────────────────────────────────────────────
#  ★ v0.17.0：面板只显示「暗金」「套装」两行，默认也只开这两类。
#  其余六类的开关在这里保留（接口在），想开改 true 就行 —— 规则星（珠宝匠/工匠）
#  不受 show_magic 影响，蓝装关了它照样亮。
show_normal    = false
show_superior  = false
show_magic     = false
show_rare      = false
show_set       = true
show_unique    = true
show_crafted   = false
show_unknown   = false


# ── 星的颜色（v0.14.0：面板上点色块就能改）──────────────────
#  星是我们自己画的，所以这里的颜色一定生效（不像引擎的标记只认色号）。
#  下面这些默认值都是引擎地图色表里的原色，不会有"被就近匹配"的偏差：
#    白 255,255,255   红 255,77,77    亮绿 0,255,0     蓝 105,105,255
#    暗金 199,179,119 灰 105,105,105  黑 0,0,0         亮金 255,215,0
#    橙 255,168,0     黄 255,255,100  暗绿 0,128,0     紫 174,0,255
#    绿 0,200,0       青 80,200,255
rgb_normal    = "255,255,255"
rgb_superior  = "255,255,255"
rgb_magic     = "105,105,255"
rgb_rare      = "255,255,100"
rgb_set       = "0,255,0"
rgb_unique    = "255,215,0"
rgb_crafted   = "255,168,0"
rgb_unknown   = "105,105,105"


# ── 自定义规则 ──────────────────────────────────────────────
#  ★ v0.16.0：rule0 已接入！带「珠宝匠」/「工匠」前缀的 4 孔蓝装会亮一颗
#  规则星（颜色 = rule0_rgb，默认蓝色），和上面「蓝色(魔法)」开关互相独立 ——
#  就算蓝装没勾，这两类照样亮星。命中判据 = 前缀 ID 1209 / 1210（本机样本实测）。
#  「工匠之」的前缀 ID 不是这两个值，不会被误认。
rule0_enable = true
rule0_rgb    = "105,105,255"
rule0_name   = ""
rule1_enable = false
rule1_rgb    = "255,215,0"
rule1_name   = ""
rule2_enable = false
rule2_rgb    = "255,255,255"
rule2_name   = ""
rule3_enable = false
rule3_rgb    = "255,168,0"
rule3_name   = ""


# ── 以下为兼容旧配置保留（面板上不显示）─────────────────────
# 引擎色号：1 和 4 会被游戏自己跳过，插件会自动用 2 / 3 顶上。
color_normal    = 6
color_superior  = 6
color_magic     = 3
color_rare      = 5
color_set       = 2
color_unique    = 7
color_crafted   = 6
color_unknown   = 6

# 引擎自带标记的图形：-1 = 不画，0~5 = 游戏自带的 6 种图形。
# 现在全部是 0 —— 引擎必须真的走一遍标记绘制，我们的坐标钩子才拿得到物品位置；
# 标记本身会被闸门拦掉，地图上只剩我们画的星。
shape_normal    = 0
shape_superior  = 0
shape_magic     = 0
shape_rare      = 0
shape_set       = 0
shape_unique    = 0
shape_crafted   = 0
shape_unknown   = 0

quality_offset = 0
